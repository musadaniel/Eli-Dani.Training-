name: Export exercise images

on:
  push:
    paths:
      - '.github/workflows/export-exercise-images.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify image set
        run: test "$(find assets/exercises -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 61
      - name: Upload exercise images
        uses: actions/upload-artifact@v4
        with:
          name: imagenes-ejercicios-DE-Training
          path: assets/exercises/*.webp
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
